<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Records</title>
<link rel="icon" href="data:,">
<style>
  :root{--green:#217346;--green-d:#185c37;--grid:#d4d4d4;--head:#f3f3f3;--text:#1f1f1f;--muted:#6b6b6b;--ok:#e2f0d9;--okd:#1e7b34;--no:#fbe0e0;--nod:#c42b1c}
  *{box-sizing:border-box}
  html,body,#root{margin:0;height:100%}
  body{font:14px/1.4 Calibri,"Segoe UI",Carlito,Arial,sans-serif;color:var(--text);background:#fff}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  [hidden]{display:none!important}
  svg{display:block}

  /* login */
  .login{min-height:100%;display:grid;place-items:center;background:#f5f5f5;padding:20px}
  .login form{background:#fff;border:1px solid var(--grid);width:100%;max-width:340px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .login h1{font-size:20px;margin:0 0 18px;font-weight:600}
  .login label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
  .login input{width:100%;border:1px solid #bdbdbd;padding:9px 10px;margin:0 0 14px;outline:none;border-radius:2px}
  .login input:focus{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
  .btn{background:var(--green);color:#fff;border:0;padding:9px 14px;border-radius:2px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{background:var(--green-d)}
  .btn:disabled{opacity:.6;cursor:default}
  .login .btn{width:100%;justify-content:center;padding:10px}
  .err{color:var(--nod);font-size:13px;min-height:18px;margin:-4px 0 8px}

  /* sheet */
  .app{display:flex;flex-direction:column;height:100%}
  .bar{background:var(--green);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
  .search{display:flex;align-items:center;gap:6px;background:#fff;color:var(--text);border-radius:2px;padding:0 8px;flex:1 1 220px;max-width:380px}
  .search svg{color:var(--muted);flex:none}
  .search input{border:0;outline:none;padding:8px 0;width:100%;background:transparent}
  .bar .tb{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;padding:7px 11px;border-radius:2px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .bar .tb:hover{background:rgba(255,255,255,.14)}
  .bar .sp{flex:1}
  .net{font-size:12px;background:#fff3cd;color:#7a5a00;padding:3px 8px;border-radius:2px}
  .wrap{flex:1;overflow:auto;background:#fff}
  table{border-collapse:separate;border-spacing:0;min-width:930px;width:100%}
  th,td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:0;height:34px}
  th{background:var(--head);font-weight:600;font-size:13px;text-align:left;padding:0 8px;position:sticky;top:0;z-index:2;color:#333;border-bottom-color:#bdbdbd}
  th:first-child,td:first-child{position:sticky;left:0;z-index:1;background:var(--head)}
  th:first-child{z-index:3}
  td:first-child input{text-align:center;font-weight:600}
  th.c{text-align:center}
  td input[type=number]{-moz-appearance:textfield}
  td input::-webkit-outer-spin-button,td input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  td input[type=text],td input[type=date],td input[type=number]{width:100%;height:33px;border:0;padding:0 8px;background:transparent;outline:none;border-radius:0}
  td input:focus{box-shadow:inset 0 0 0 2px var(--green);background:#fff}
  td.tick{text-align:center;width:96px}
  .chk{width:22px;height:22px;border:1.5px solid #8a8a8a;background:#fff;border-radius:3px;display:inline-grid;place-items:center;padding:0;vertical-align:middle}
  .chk svg{opacity:0}
  .chk:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .chk.ap.on{background:var(--okd);border-color:var(--okd);color:#fff}
  .chk.rj.on{background:var(--nod);border-color:var(--nod);color:#fff}
  .chk.on svg{opacity:1}
  tr.approved td:not(:first-child){background:var(--ok)}
  tr.rejected td:not(:first-child){background:var(--no)}
  td.del{width:40px;text-align:center}
  .x{border:0;background:transparent;color:#9a9a9a;width:32px;height:32px;display:inline-grid;place-items:center;border-radius:2px}
  .x:hover{color:var(--nod);background:#fde7e7}
  .c-sn{width:72px}.c-name{min-width:220px}.c-date{width:170px}
  .empty{padding:28px 12px;color:var(--muted);text-align:center}
  .foot{border-top:1px solid var(--grid);background:var(--head);display:flex;align-items:center;gap:14px;padding:6px 12px;font-size:13px;flex-wrap:wrap}
  .foot .add{background:#fff;border:1px solid #bdbdbd;padding:5px 10px;border-radius:2px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .foot .add:hover{border-color:var(--green);color:var(--green)}
  .foot b{font-weight:600}
  a.tb{text-decoration:none}
  .bar .ttl{font-size:16px;font-weight:600;margin:0 4px}
  .home{flex:1;display:flex;align-items:center;justify-content:center;gap:20px;padding:24px;flex-wrap:wrap;background:#f5f5f5}
  .tile{width:260px;height:180px;background:#fff;border:1px solid var(--grid);border-top:4px solid var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .tile:hover,.tile:focus-visible{border-color:var(--green);box-shadow:0 2px 12px rgba(33,115,70,.18);outline:none}
  .tile svg{color:var(--green)}
  .tile b{font-size:20px;font-weight:600}
  .tile span{color:var(--muted);font-size:13px;min-height:18px}
  table.docs{min-width:1130px}
  .c-wk{width:130px}
  td.wk input{text-align:center}
  table.pdocs{min-width:420px}
  /* expenses */
  .cards{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;padding:12px;background:#f5f5f5;border-bottom:1px solid var(--grid)}
  .cards .card{background:#fff;border:1px solid var(--grid);border-top:3px solid var(--green);padding:8px 12px}
  .cards .card span{display:block;font-size:12px;color:var(--muted)}
  .cards .card b{font-size:18px;font-weight:700}
  .cards .card.neg{border-top-color:var(--nod)} .cards .card.neg b{color:var(--nod)}
  .cards .card.pos b{color:var(--okd)}
  .etabs{display:flex;gap:0;border-bottom:1px solid var(--grid);background:#fff;position:sticky;left:0}
  .etabs button{border:0;background:transparent;padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
  .etabs button.on{color:var(--green-d);border-bottom-color:var(--green)}
  .etools{display:flex;gap:8px;padding:8px 10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--grid)}
  .search.light{border:1px solid #bdbdbd;flex:0 1 300px}
  .etools select{border:1px solid #bdbdbd;padding:7px 8px;border-radius:2px;background:#fff}
  table.etable{min-width:1000px}
  td select{width:100%;height:33px;border:0;background:transparent;padding:0 6px;outline:none}
  td select:focus{box-shadow:inset 0 0 0 2px var(--green);background:#fff}
  td.amt input{text-align:right}
  .c-amt{width:120px}.c-en{min-width:180px}.c-cat{width:150px}.c-mon{min-width:200px}
  td.calc{text-align:right;padding:0 8px;white-space:nowrap;color:var(--muted)}
  td.calc.pos,.wstats .pos{color:var(--okd);font-weight:700}
  td.calc.neg,.wstats .neg{color:var(--nod);font-weight:700}
  #weeks{padding:12px;display:grid;gap:12px;background:#f5f5f5;min-height:100%}
  .week{background:#fff;border:1px solid var(--grid);padding:12px 14px}
  .week.now{border-color:var(--green)}
  .whead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .whead b{font-size:15px}
  .wtag{font-size:12px;background:#e8f2ec;color:var(--green-d);padding:2px 8px;border-radius:2px}
  .week.now .wtag{background:var(--green);color:#fff}
  .wstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
  .wstats span{display:block;font-size:12px;color:var(--muted)}
  .wstats b{font-size:16px}
  .wcats{display:grid;gap:4px;margin:6px 0}
  .wcat{display:grid;grid-template-columns:130px 1fr 100px;align-items:center;gap:8px;font-size:13px}
  .wcat i{display:block;height:10px;background:var(--green);border-radius:1px}
  .wcat b{text-align:right}
  .wtop{font-size:13px;color:var(--muted)} .wtop b{color:var(--text)}
  @media (max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.wstats{grid-template-columns:repeat(2,1fr)}.wcat{grid-template-columns:100px 1fr 80px}}
  .pnote{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-bottom:1px solid var(--grid);background:#fff;color:#c9c9c9;cursor:text}
  .pnote svg{flex:none;margin-top:3px}
  .pnote textarea{flex:1;border:0;outline:none;resize:none;background:transparent;font:inherit;line-height:1.5;padding:2px 0;min-height:24px;overflow:hidden;color:var(--text)}
  .pnote textarea::placeholder{color:#a8a8a8}
  .pnote:focus-within{box-shadow:inset 0 0 0 2px var(--green)}
  .pnote.filled{background:#fde2e2;color:var(--nod);box-shadow:inset 4px 0 0 var(--nod)}
  .pnote.filled:focus-within{box-shadow:inset 4px 0 0 var(--nod),inset 0 0 0 2px var(--nod)}
  .pnote.filled textarea{color:var(--nod);font-weight:700;font-size:15px}
  .stage[hidden]{display:none}
  tr.newrow td{background:#fafafa}
  tr.newrow td.num{color:#b0b0b0}
  tr.newrow td.num svg{margin:auto}
  tr.newrow input::placeholder{color:#a8a8a8}
  td.tk.filled{background:#fde2e2!important;box-shadow:inset 3px 0 0 var(--nod)}
  td.tk.filled input{color:var(--nod);font-weight:700}
  .stage{margin:0 0 18px}
  .shead{display:flex;align-items:center;gap:10px;background:#e8f2ec;border-bottom:1px solid #bcd8c6;border-top:1px solid #bcd8c6;padding:6px 10px;position:sticky;left:0;min-width:0}
  .sname{font:inherit;font-weight:700;font-size:15px;border:1px solid transparent;background:transparent;padding:5px 8px;border-radius:2px;min-width:0;width:260px;max-width:50vw;outline:none;color:var(--green-d)}
  .sname:hover{border-color:#bcd8c6;background:#fff}
  .sname:focus{border-color:var(--green);box-shadow:0 0 0 1px var(--green);background:#fff}
  .scount{font-size:13px;color:var(--muted);white-space:nowrap}
  .shead .add{background:#fff;border:1px solid #bdbdbd;padding:5px 10px;border-radius:2px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .shead .add:hover{border-color:var(--green);color:var(--green)}
  .stage th{top:0}
  .c-dn{min-width:200px}.c-tx{min-width:170px}
  td.num{text-align:center;font-weight:600;width:72px}
  .toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:#323232;color:#fff;padding:9px 14px;border-radius:2px;font-size:13px;z-index:50}
  @media (max-width:600px){.bar .tb span{display:none}.bar .tb{padding:7px 9px}}
</style>
</head>
<body>
<div id="root"></div>

<script src="firebase-app-compat.js"></script>
<script src="firebase-auth-compat.js"></script>
<script src="firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
'use strict';
// Record panel: separate site (own login), data in rec/ of the same database.
const app = firebase.initializeApp(window.CK_FIREBASE, 'ck-records');
const auth = app.auth(), db = app.database();
const TS = () => firebase.database.ServerValue.TIMESTAMP;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const svg = {
  search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  plus: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  down: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg>',
  home: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7M5 10v10h5v-6h4v6h5V10"/></svg>',
  list: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6v3H9zM7 5.5H5V21h14V5.5h-2"/><path d="m8.5 12 1.5 1.5 3-3M8.5 17.5h7"/></svg>',
  grid: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M3 14.5h18M9 4v16"/></svg>',
  alert: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>',
  wallet: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5V18a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-2 2 2 0 0 1 2-2h12v4"/><circle cx="16" cy="14.5" r="1.2"/></svg>',
  pin: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  tasks: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17M11 6h9M11 12h9M11 18h9"/></svg>',
  out: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>',
};
const domain = window.CK_STAFF_EMAIL_DOMAIN || 'staff.cloudkitchen.app';
const emailOf = u => `${u}.rec@${domain}`;
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function friendly(e) {
  const c = (e && (e.code || e.message)) || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/i.test(c)) return 'Wrong username or password';
  if (/email-already-in-use/i.test(c)) return 'That username is taken';
  if (/weak-password/i.test(c)) return 'Password must be at least 6 characters';
  if (/too-many-requests/i.test(c)) return 'Too many tries. Wait a minute and try again';
  if (/network/i.test(c)) return 'No internet connection';
  if (/PERMISSION_DENIED|permission/i.test(c)) return 'Not allowed';
  return 'Something went wrong. Try again';
}

// ---------- login / first-time setup ----------
let unsub = null, creating = false, signedIn = false;
// pages: home (two buttons), #needs (What I need), #records (See records)
function stop() { if (unsub) { unsub(); unsub = null; } }
function route() {
  if (!signedIn) return;
  stop();
  const h = location.hash;
  if (h === '#records') showSheet(); else if (h === '#needs') showDocs(); else if (h === '#where') showWhere(); else if (h === '#expenses') showExpenses(); else showHome();
}
window.addEventListener('hashchange', route);
auth.onAuthStateChanged(async user => {
  if (creating) return; // first account is being set up
  stop();
  signedIn = false;
  if (!user) return showLogin();
  try {
    const ok = (await db.ref('rec/members/' + user.uid).once('value')).val() === true;
    if (!ok) { await auth.signOut(); return showLogin('This account has no access'); }
    signedIn = true; route();
  } catch (e) { await auth.signOut(); showLogin(friendly(e)); }
});

async function showLogin(msg) {
  let setupDone = true;
  try { setupDone = (await db.ref('rec/setup').once('value')).val() === true; } catch {}
  $('#root').innerHTML = `
    <div class="login"><form id="lf" autocomplete="on">
      <h1>${setupDone ? 'Sign in' : 'Create account'}</h1>
      <label for="u">Username</label><input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="${setupDone ? 'current-password' : 'new-password'}" required minlength="6">
      ${setupDone ? '' : '<label for="p2">Password again</label><input id="p2" type="password" autocomplete="new-password" required minlength="6">'}
      <div class="err" id="lerr">${esc(msg || '')}</div>
      <button class="btn">${setupDone ? 'Sign in' : 'Create account'}</button>
    </form></div>`;
  $('#u').focus();
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const u = $('#u').value.trim().toLowerCase(), pw = $('#p').value, err = $('#lerr'), b = $('#lf button');
    if (!/^[a-z0-9_]{3,20}$/.test(u)) return err.textContent = 'Username: 3 to 20 letters, numbers or _';
    if (!setupDone && pw !== $('#p2').value) return err.textContent = 'Passwords do not match';
    b.disabled = true; err.textContent = '';
    try {
      if (setupDone) await auth.signInWithEmailAndPassword(emailOf(u), pw);
      else {
        creating = true;
        try {
          const { user } = await auth.createUserWithEmailAndPassword(emailOf(u), pw);
          try { await db.ref('rec').update({ setup: true, ['members/' + user.uid]: true }); }
          catch (x) { creating = false; await auth.signOut(); throw x; }
        } finally { creating = false; }
        signedIn = true; route();
      }
    } catch (x) { err.textContent = friendly(x); b.disabled = false; }
  };
}

// ---------- the sheet ----------
const rows = new Map(); // id -> data
const FIELDS = ['sn', 'name', 'forDate', 'sent', 'reply'];
let q = '';
function showHome() {
  $('#root').innerHTML = `
    <div class="app">
      <div class="bar">
        <span class="sp"></span>
        <button class="tb" id="out" aria-label="Log out">${svg.out}<span>Log out</span></button>
      </div>
      <div class="home">
        <a class="tile" href="#needs" id="goNeeds">${svg.list}<b>What I need</b><span id="nDocs"></span></a>
        <a class="tile" href="#records" id="goRecords">${svg.grid}<b>See records</b><span id="nRecs"></span></a>
        <a class="tile" href="#where" id="goWhere">${svg.pin}<b>Where to what</b><span id="nPlaces"></span></a>
        <a class="tile" href="#expenses" id="goExp">${svg.wallet}<b>Expenses</b><span id="nExp"></span></a>
      </div>
    </div>`;
  $('#out').onclick = () => auth.signOut();
  const a = db.ref('rec/docs'), b = db.ref('rec/rows'), c = db.ref('rec/places'), ei = db.ref('rec/income'), ee = db.ref('rec/expenses');
  let gotI = 0, gotE = 0;
  const fe = () => { const e = $('#nExp'); if (e) e.textContent = `Left ${rs(gotI - gotE)}`; };
  const fi = s => { gotI = Object.values(s.val() || {}).reduce((t, x) => t + (Number(x.amount) || 0), 0); fe(); };
  const fx = s => { gotE = Object.values(s.val() || {}).reduce((t, x) => t + (Number(x.cost) || 0), 0); fe(); };
  ei.on('value', fi, () => {}); ee.on('value', fx, () => {});
  const fc = s => { const n = Object.keys(s.val() || {}).length; const e = $('#nPlaces'); if (e) e.textContent = n === 1 ? '1 name' : n + ' names'; };
  c.on('value', fc, () => {});
  const fa = s => { const v = Object.values(s.val() || {}), n = v.length, y = v.filter(d => d.have === 'yes').length; const e = $('#nDocs'); if (e) e.textContent = (n === 1 ? '1 document' : n + ' documents') + (n ? ` · I have ${y}` : ''); };
  const fb = s => { const n = Object.keys(s.val() || {}).length; const e = $('#nRecs'); if (e) e.textContent = n === 1 ? '1 record' : n + ' records'; };
  a.on('value', fa, () => {}); b.on('value', fb, () => {});
  unsub = () => { a.off('value', fa); b.off('value', fb); c.off('value', fc); ei.off('value', fi); ee.off('value', fx); };
}
const homeBtn = () => `<a class="tb" href="#" id="home">${svg.home}<span>Home</span></a>`;

// ---------- What I need: documents grouped in stages ----------
const docs = new Map(), stages = new Map();

async function waitFor(sel) {

}

// ---------- saving helper ----------
function saveAt(path, v, now) {

// ---------- Expenses: money received, expenses, weekly summaries ----------

const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const niceDate = s => parseYmd(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const niceDateY = s => parseYmd(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
let expTab = 'spent', expPeriod = 'all', eq = '', pendingExp = null;

const spentFrom = id => [...expenses.values()].filter(e => e.money === id).reduce((a, e) => a + (Number(e.cost) || 0), 0);
function inPeriod(date, p) {
  if (p === 'all') return true;
  if (!date) return false;
  const t = today(), ws = weekStart(t);
  if (p === 'week') return date >= ws && date <= t;
  if (p === 'lastweek') return date >= addDays(ws, -7) && date < ws;
  if (p === 'month') return date.slice(0, 7) === t.slice(0, 7);
  return true;
}

function drawCards() {

  const mo = all.filter(x => inPeriod(x.date, 'month')).reduce((a, x) => a + (Number(x.cost) || 0), 0);

}

const incomeIds = () => [...income.keys()].sort((a, b) => String(income.get(a).date || '').localeCompare(String(income.get(b).date || '')) || byTime(income)(a, b));
const expIds = () => [...expenses.keys()].sort((a, b) => String(expenses.get(a).date || '').localeCompare(String(expenses.get(b).date || '')) || byTime(expenses)(a, b));
const moneyLabel = id => { const it = income.get(id); return it ? `${it.from || 'Money'} (${rs(it.amount)}${it.date ? ', ' + niceDate(it.date) : ''})` : ''; };
function moneyOptions(sel) {
  return `<option value="">Choose</option>` + incomeIds().map(id => `<option value="${esc(id)}" ${id === sel ? 'selected' : ''}>${esc(moneyLabel(id))}</option>`).join('');
}
const catOptions = sel => `<option value="">Choose</option>` + CATS.map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');

// one table row: fills inputs without touching the one being typed in
function fillRow(tr, item) {
  tr.querySelectorAll('[data-x]').forEach(i => {
    const f = i.dataset.x;
    let v = item[f] ?? '';
    if ((f === 'amount' || f === 'cost') && Number(v) === 0) v = '';
    v = String(v);
    if (i === document.activeElement) return;
    if (i.tagName === 'SELECT') { if (i.value !== v) i.value = v; } else if (i.value !== v) i.value = v;
  });
}

    tr.hidden = !hit && !tr.contains(document.activeElement);

function drawIncomeRows() {

function drawLeft() {
  document.querySelectorAll('#irows tr[data-id]').forEach(tr => {
    const it = income.get(tr.dataset.id); if (!it) return;
    const sp = spentFrom(tr.dataset.id), left = (Number(it.amount) || 0) - sp;
    tr.querySelector('.sp-c').textContent = rs(sp);
    const l = tr.querySelector('.left-c'); l.textContent = rs(left); l.classList.toggle('neg', left < 0); l.classList.toggle('pos', left > 0);
  });
}
function drawExpTotals() {
  const e = $('#esum'); if (!e) return;
  if (expTab === 'spent') {
    const shown = expIds().filter(id => { const tr = document.querySelector(`#erows tr[data-id="${CSS.escape(id)}"]`); return tr && !tr.hidden; });
    const tot = shown.reduce((a, id) => a + (Number(expenses.get(id).cost) || 0), 0);
    e.innerHTML = `<b>${shown.length}</b> ${shown.length === 1 ? 'expense' : 'expenses'} shown · Total <b>${rs(tot)}</b>`;
  } else if (expTab === 'got') {
    const tot = [...income.values()].reduce((a, x) => a + (Number(x.amount) || 0), 0);
    e.innerHTML = `<b>${income.size}</b> ${income.size === 1 ? 'entry' : 'entries'} · Total received <b>${rs(tot)}</b>`;
  } else {
    e.innerHTML = `Weeks run Sunday to Saturday. Each finished week is saved.`;
  }
}

// typing in the empty row: create the line, then move the cursor into it
function newExpRow(kind, f, val) {
  if (pendingExp) return;
  const path = kind === 'income' ? 'rec/income' : 'rec/expenses';
  const ref = db.ref(path).push();
  const row = kind === 'income'
    ? { date: today(), from: '', amount: 0, note: '', createdAt: TS() }
    : { date: today(), name: '', cost: 0, where: '', cat: '', money: '', createdAt: TS() };
  row[f] = typeof val === 'string' ? cleanTxt(val) : val;
  pendingExp = { id: ref.key, kind, f };
  if (kind === 'expense' && expPeriod !== 'all' && !inPeriod(row.date, expPeriod)) { expPeriod = 'all'; const p = $('#eper'); if (p) p.value = 'all'; }
  ref.set(row).catch(x => { pendingExp = null; toast(friendly(x)); });
}
function takePending(tb, nr, kind) {
  if (!pendingExp || pendingExp.kind !== kind) return;
  const tr = tb.querySelector(`tr[data-id="${CSS.escape(pendingExp.id)}"]`); if (!tr) return;
  const f = pendingExp.f; pendingExp = null;
  const src = nr.querySelector(`[data-x="${f}"]`), dst = tr.querySelector(`[data-x="${f}"]`);
  const typed = src.tagName === 'SELECT' || src.type === 'date' ? null : src.value;
  nr.querySelectorAll('input').forEach(i => { i.value = ''; }); nr.querySelectorAll('select').forEach(s => { s.value = ''; });
  if (typed !== null) {
    dst.value = typed; dst.focus();
    if (dst.type !== 'number') dst.setSelectionRange(typed.length, typed.length);
    const m = kind === 'income' ? income : expenses, cur = m.get(tr.dataset.id) || {};
    const num = f === 'amount' || f === 'cost', v = num ? (Number(typed) || 0) : typed;
    if (String(v) !== String(cur[f] ?? '')) saveAt(`rec/${kind === 'income' ? 'income' : 'expenses'}/${tr.dataset.id}/${f}`, num ? v : cleanTxt(typed));
  } else tr.querySelector('[data-x=name], [data-x=from]').focus();
  tr.scrollIntoView({ block: 'nearest' });
}

// ---------- weekly summaries ----------
function weekData() {
  const weeks = new Map();
  const W = ws => { if (!weeks.has(ws)) weeks.set(ws, { received: 0, spent: 0, count: 0, cats: {}, items: [] }); return weeks.get(ws); };
  for (const it of income.values()) if (it.date) W(weekStart(it.date)).received += Number(it.amount) || 0;
  for (const ex of expenses.values()) if (ex.date) {
    const w = W(weekStart(ex.date)), c = Number(ex.cost) || 0;
    w.spent += c; w.count++; w.items.push(ex);
    const k = ex.cat || 'none'; w.cats[k] = (w.cats[k] || 0) + c;
  }
  return weeks;
}
function saveWeeks() {
  // every finished week gets its summary saved (and re-saved if its entries were changed later)
  const cur = weekStart(today()), up = {}, data = weekData();
  for (const [ws, w] of data) {
    if (ws >= cur) continue;
    const row = { received: w.received, spent: w.spent, count: w.count, cats: w.cats };
    const old = weeksSaved.get(ws);
    const same = old && old.received === row.received && old.spent === row.spent && old.count === row.count && JSON.stringify(old.cats || {}) === JSON.stringify(row.cats);
    if (!same) up[ws] = { ...row, savedAt: TS() };
  }
  for (const ws of weeksSaved.keys()) if (!data.has(ws)) up[ws] = null; // week no longer has entries
  if (Object.keys(up).length) db.ref('rec/expWeeks').update(up).catch(() => {});
}
function drawWeeks() {
  const el = $('#weeks'); if (!el) return;
  const data = weekData(), cur = weekStart(today());
  const keys = [...new Set([...data.keys(), ...weeksSaved.keys()])].sort().reverse();
  if (!keys.length) { el.innerHTML = '<div class="empty">No entries yet</div>'; drawExpTotals(); return; }
  // money left at the end of each week
  let run = 0; const leftAt = {};
  [...keys].reverse().forEach(ws => { const w = data.get(ws) || weeksSaved.get(ws) || {}; run += (w.received || 0) - (w.spent || 0); leftAt[ws] = run; });
  el.innerHTML = keys.map(ws => {
    const w = data.get(ws) || { ...weeksSaved.get(ws), items: [] };
    const saved = weeksSaved.has(ws), now = ws === cur;
    const cats = Object.entries(w.cats || {}).sort((a, b) => b[1] - a[1]);
    const max = Math.max(1, ...cats.map(c => c[1]));
    const top = [...(w.items || [])].sort((a, b) => (Number(b.cost) || 0) - (Number(a.cost) || 0)).slice(0, 3);
    return `
      <section class="week ${now ? 'now' : ''}" data-week="${ws}">
        <div class="whead"><b>${niceDate(ws)} – ${niceDateY(addDays(ws, 6))}</b>
          <span class="wtag">${now ? 'This week, so far' : saved ? 'Saved' : ''}</span></div>
        <div class="wstats">
          <div><span>Received</span><b>${rs(w.received)}</b></div>
          <div><span>Spent</span><b>${rs(w.spent)}</b></div>
          <div><span>${now ? 'Left now' : 'Left at end of week'}</span><b class="${leftAt[ws] < 0 ? 'neg' : 'pos'}">${rs(leftAt[ws])}</b></div>
          <div><span>Expenses</span><b>${w.count || 0}</b></div>
        </div>
        ${cats.length ? `<div class="wcats">${cats.map(([k, v]) => `<div class="wcat"><span>${esc(catName(k) || 'No category')}</span><i style="width:${Math.max(4, Math.round(v / max * 100))}%"></i><b>${rs(v)}</b></div>`).join('')}</div>` : ''}
        ${top.length ? `<div class="wtop"><span>Biggest:</span> ${top.map(t => `${esc(t.name || 'Expense')} <b>${rs(t.cost)}</b>`).join(' · ')}</div>` : ''}
      </section>`;
  }).join('');
  drawExpTotals();
}

function expDownload() {
  const cell = v => /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  const lines = [['Type', 'Date', 'Name / From whom', 'Amount (Rs.)', 'Where / Note', 'Category', 'Money used']];
  incomeIds().forEach(id => { const x = income.get(id); lines.push(['Received', x.date || '', x.from || '', x.amount || 0, x.note || '', '', '']); });
  expIds().forEach(id => { const x = expenses.get(id); lines.push(['Spent', x.date || '', x.name || '', x.cost || 0, x.where || '', catName(x.cat), moneyLabel(x.money)]); });
  const csv = '﻿' + lines.map(l => l.map(x => cell(String(x))).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `expenses-${today()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden></div>
      </div>
      <div class="foot">
        <button class="add" id="add2">${svg.plus}New row</button>
        <span id="sum"></span>
      </div>
    </div>`;
  $('#q').oninput = () => { q = $('#q').value.trim().toLowerCase(); filter(); };
  $('#add').onclick = $('#add2').onclick = addRow;
  $('#csv').onclick = download;
  const tb = $('#rows');
  tb.addEventListener('input', onInput);
  tb.addEventListener('change', onInput);
  tb.addEventListener('click', onClick);
  tb.addEventListener('keydown', onKey);
  tb.addEventListener('focusout', () => setTimeout(() => { if (!tb.contains(document.activeElement)) sortRows(); }, 0));

  const ref = db.ref('rec/rows');
  const onVal = snap => {
    const seen = new Set();
    snap.forEach(c => { seen.add(c.key); rows.set(c.key, c.val()); drawRow(c.key); });
    for (const id of [...rows.keys()]) if (!seen.has(id)) { rows.delete(id); const tr = trOf(id); if (tr) tr.remove(); }
    if (!tb.contains(document.activeElement)) sortRows();
    filter();
  };
  ref.on('value', onVal, e => toast(friendly(e)));
  const con = db.ref('.info/connected');
  const onCon = s => { const n = $('#net'); if (n) n.hidden = s.val() !== false; };
  con.on('value', onCon);
  unsub = () => { ref.off('value', onVal); con.off('value', onCon); rows.clear(); };
}

const trOf = id => document.querySelector(`#rows tr[data-id="${CSS.escape(id)}"]`);
function drawRow(id) {
  const r = rows.get(id); if (!r) return;
  let tr = trOf(id);
  if (!tr) {
    tr = document.createElement('tr'); tr.dataset.id = id;
    tr.innerHTML = `
      <td><input type="text" data-f="sn" maxlength="12" inputmode="numeric" aria-label="S.N."></td>
      <td><input type="text" data-f="name" maxlength="120" aria-label="Name"></td>
      <td><input type="date" data-f="forDate" aria-label="For when"></td>
      <td><input type="date" data-f="sent" aria-label="Sent date"></td>
      <td><input type="date" data-f="reply" aria-label="Reply received date"></td>
      <td class="tick"><button type="button" class="chk ap" data-s="approved" aria-label="Approved">${svg.check}</button></td>
      <td class="tick"><button type="button" class="chk rj" data-s="rejected" aria-label="Rejected">${svg.check}</button></td>
      <td class="del"><button type="button" class="x" aria-label="Delete row">${svg.trash}</button></td>`;
    $('#rows').appendChild(tr);
  }
  for (const f of FIELDS) { const i = tr.querySelector(`[data-f="${f}"]`); if (i !== document.activeElement && i.value !== (r[f] || '')) i.value = r[f] || ''; }
  tr.className = r.status || '';
  tr.querySelectorAll('.chk').forEach(b => { const on = r.status === b.dataset.s; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
}

const snNum = r => { const n = parseFloat(r.sn); return isNaN(n) ? Infinity : n; };
function sortRows() {
  const tb = $('#rows'); if (!tb) return;
  const ids = [...rows.keys()].sort((a, b) => snNum(rows.get(a)) - snNum(rows.get(b)) || (rows.get(a).createdAt || 0) - (rows.get(b).createdAt || 0));
  ids.forEach((id, i) => { const tr = trOf(id); if (tr && tb.children[i] !== tr) tb.insertBefore(tr, tb.children[i] || null); });
}
function filter() {
  let shown = 0, ap = 0, rj = 0;
  for (const [id, r] of rows) {
    const hit = !q || String(r.name || '').toLowerCase().includes(q) || String(r.sn || '').toLowerCase() === q;
    const tr = trOf(id); if (tr) tr.hidden = !hit;
    if (hit) shown++;
    if (r.status === 'approved') ap++; else if (r.status === 'rejected') rj++;
  }
  const total = rows.size, e = $('#empty');
  e.hidden = shown > 0;
  e.textContent = total ? `No name matches "${$('#q').value.trim()}"` : 'No records yet';
  $('#sum').innerHTML = `${q ? `<b>${shown}</b> of ${total} shown · ` : ''}<b>${total}</b> total · Approved <b>${ap}</b> · Rejected <b>${rj}</b> · Waiting <b>${total - ap - rj}</b>`;
}

// save typing (short delay so every key isn't a save)
const timers = {};
function onInput(e) {
  const i = e.target.closest('[data-f]'); if (!i) return;
  const id = i.closest('tr').dataset.id, f = i.dataset.f, key = id + f;
  const v = f === 'name' || f === 'sn' ? i.value.replace(/\s+/g, ' ').trimStart() : i.value;
  const r = rows.get(id); if (r) r[f] = v;
  clearTimeout(timers[key]);
  const save = () => db.ref('rec/rows/' + id).update({ [f]: f === 'name' || f === 'sn' ? v.trim() : v, updatedAt: TS() }).catch(x => toast(friendly(x)));
  if (e.type === 'change') save(); else timers[key] = setTimeout(save, 500);
  if (f === 'name' || f === 'sn') filter();
}
function onClick(e) {
  const b = e.target.closest('.chk, .x'); if (!b) return;
  const tr = b.closest('tr'), id = tr.dataset.id, r = rows.get(id); if (!r) return;
  if (b.classList.contains('x')) {
    if (!confirm(`Delete row ${r.sn || ''} ${r.name || ''}?`.replace(/\s+/g, ' '))) return;
    FIELDS.forEach(f => clearTimeout(timers[id + f]));
    db.ref('rec/rows/' + id).remove().catch(x => toast(friendly(x)));
    return;
  }
  const status = r.status === b.dataset.s ? '' : b.dataset.s; // tick again to clear
  r.status = status; drawRow(id); filter();
  db.ref('rec/rows/' + id).update({ status, updatedAt: TS() }).catch(x => toast(friendly(x)));
}
// Enter moves down like Excel; on the last row it makes a new row
function onKey(e) {
  if (e.key !== 'Enter') return;
  const i = e.target.closest('[data-f]'); if (!i) return;
  e.preventDefault();
  let tr = i.closest('tr').nextElementSibling;
  while (tr && tr.hidden) tr = tr.nextElementSibling;
  if (tr) tr.querySelector(`[data-f="${i.dataset.f}"]`).focus();
  else if (!q) addRow(i.dataset.f);
}

async function addRow(focusField) {
  const max = Math.max(0, ...[...rows.values()].map(snNum).filter(isFinite));
  const ref = db.ref('rec/rows').push();
  try {
    await ref.set({ sn: String(Math.floor(max) + 1), name: '', forDate: '', sent: '', reply: '', status: '', createdAt: TS(), updatedAt: TS() });
  } catch (x) { return toast(friendly(x)); }
  if (q) { $('#q').value = ''; q = ''; filter(); }
  let tr = trOf(ref.key);
  for (let i = 0; !tr && i < 40; i++) { await new Promise(r => setTimeout(r, 50)); tr = trOf(ref.key); }
  if (tr) { sortRows(); tr.scrollIntoView({ block: 'nearest' }); tr.querySelector(`[data-f="${typeof focusField === 'string' ? focusField : 'name'}"]`).focus(); }
}

function download() {
  const cell = v => /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  const list = [...rows.values()].sort((a, b) => snNum(a) - snNum(b) || (a.createdAt || 0) - (b.createdAt || 0));
  const lines = [['S.N.', 'Name', 'For when', 'Sent date', 'Reply received date', 'Approved', 'Rejected']]
    .concat(list.map(r => [r.sn || '', r.name || '', r.forDate || '', r.sent || '', r.reply || '', r.status === 'approved' ? 'Yes' : '', r.status === 'rejected' ? 'Yes' : '']));
  const csv = '﻿' + lines.map(l => l.map(x => cell(String(x))).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `records-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
</script>
</body>
</html>
