<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Records</title>
<link rel="icon" href="data:,">
<style>
  :root{--green:#217346;--green-d:#185c37;--grid:#d4d4d4;--head:#f3f3f3;--text:#1f1f1f;--muted:#6b6b6b;--ok:#e2f0d9;--okd:#1e7b34;--no:#fbe0e0;--nod:#c42b1c;--bg:#fff;--card:#fff;--soft:#f5f5f5;--soft2:#fafafa;--sh:#e8f2ec;--shb:#bcd8c6;--redbg:#fde2e2;--redbg2:#fff6f6;--hov:#f3f9f5;--bd:#bdbdbd;--orbg:#fff1d6;--mark:#fff0a8;color-scheme:light}
  html.dark{--bg:#1b1c1f;--card:#24262a;--soft:#18191c;--soft2:#202226;--head:#2c2f33;--grid:#3a3d42;--text:#e7e7e7;--muted:#a3a7ad;--sh:#1d3127;--shb:#2e4c3b;--redbg:#4b2326;--redbg2:#352023;--ok:#1d3826;--no:#3d2124;--hov:#22342a;--bd:#4b4e54;--orbg:#4a391b;--mark:#6b5a12;--green-d:#8fd1a8;color-scheme:dark}
  html.dark .bar{background:#16492d}
  html.dark .tile svg{color:#5fbf86}
  html.dark .login{background:var(--soft)} html.dark .login form{background:var(--card);border-color:var(--grid)}
  html.dark .login input,html.dark .etools select{background:var(--card);color:var(--text);border-color:var(--bd)}
  html.dark .search{background:var(--card);color:var(--text)}
  html.dark .chk{background:var(--card);border-color:#777}
  html.dark .net{background:#4a391b;color:#ffd98a}
  html.dark td input:focus,html.dark td select:focus{background:var(--card)}
  html.dark .toast{background:#e7e7e7;color:#1b1c1f} html.dark .toast.act button{color:#1b1c1f;border-color:#1b1c1f55}
  html.dark #nArch{background:#e7e7e7}
  *{box-sizing:border-box}
  html,body,#root{margin:0;height:100%}
  body{font:14px/1.4 Calibri,"Segoe UI",Carlito,Arial,sans-serif;color:var(--text);background:var(--bg)}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  [hidden]{display:none!important}
  svg{display:block}

  /* login */
  .login{min-height:100%;display:grid;place-items:center;background:var(--soft);padding:20px}
  .login form{background:var(--card);border:1px solid var(--grid);width:100%;max-width:340px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .login h1{font-size:20px;margin:0 0 18px;font-weight:600}
  .login label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
  .login input{width:100%;border:1px solid var(--bd);padding:9px 10px;margin:0 0 14px;outline:none;border-radius:2px}
  .login input:focus{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
  .btn{background:var(--green);color:#fff;border:0;padding:9px 14px;border-radius:2px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{background:var(--green-d)}
  .btn:disabled{opacity:.6;cursor:default}
  .login .btn{width:100%;justify-content:center;padding:10px}
  .err{color:var(--nod);font-size:13px;min-height:18px;margin:-4px 0 8px}

  /* sheet */
  .app{display:flex;flex-direction:column;height:100%}
  .bar{background:var(--green);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
  .search{display:flex;align-items:center;gap:6px;background:var(--card);color:var(--text);border-radius:2px;padding:0 8px;flex:1 1 220px;max-width:380px}
  .search svg{color:var(--muted);flex:none}
  .search input{border:0;outline:none;padding:8px 0;width:100%;background:transparent}
  .bar .tb{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;padding:7px 11px;border-radius:2px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .bar .tb:hover{background:rgba(255,255,255,.14)}
  .bar .sp{flex:1}
  .net{font-size:12px;background:#fff3cd;color:#7a5a00;padding:3px 8px;border-radius:2px}
  .wrap{flex:1;overflow:auto;background:var(--card)}
  table{border-collapse:separate;border-spacing:0;min-width:930px;width:100%}
  th,td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:0;height:34px}
  th{background:var(--head);font-weight:600;font-size:13px;text-align:left;padding:0 8px;position:sticky;top:0;z-index:2;color:var(--text);border-bottom-color:var(--bd)}
  th:first-child,td:first-child{position:sticky;left:0;z-index:1;background:var(--head)}
  th:first-child{z-index:3}
  td:first-child input{text-align:center;font-weight:600}
  th.c{text-align:center}
  td input[type=number]{-moz-appearance:textfield}
  td input::-webkit-outer-spin-button,td input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  td input[type=text],td input[type=date],td input[type=number]{width:100%;height:33px;border:0;padding:0 8px;background:transparent;outline:none;border-radius:0}
  td input:focus{box-shadow:inset 0 0 0 2px var(--green);background:var(--card)}
  td.tick{text-align:center;width:96px}
  .chk{width:22px;height:22px;border:1.5px solid #8a8a8a;background:var(--card);border-radius:3px;display:inline-grid;place-items:center;padding:0;vertical-align:middle}
  .chk svg{opacity:0}
  .chk:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .chk.ap.on{background:var(--okd);border-color:var(--okd);color:#fff}
  .chk.rj.on{background:var(--nod);border-color:var(--nod);color:#fff}
  .chk.on svg{opacity:1}
  tr.approved td:not(:first-child){background:var(--ok)}
  tr.rejected td:not(:first-child){background:var(--no)}
  .selbtn{display:none;width:22px;height:22px;border:1.5px solid #8a8a8a;background:var(--card);border-radius:3px;place-items:center;padding:0;vertical-align:middle;color:#fff}
  .selbtn svg{opacity:0} .selbtn.on{background:var(--okd);border-color:var(--okd)} .selbtn.on svg{opacity:1} html.dark .selbtn{border-color:#777}
  .selmode tr[data-id] td:first-child .selbtn{display:inline-grid;margin:0 auto}
  .selmode tr[data-id] td:first-child{text-align:center;cursor:pointer}
  .selmode tr[data-id] td:first-child > input,.selmode tr[data-id] td:first-child > .n{display:none}
  tr.picked td{box-shadow:inset 0 0 0 999px rgba(33,115,70,.13)}
  html.dark tr.picked td{box-shadow:inset 0 0 0 999px rgba(95,191,134,.18)}
  .selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 12px;background:var(--sh);border-bottom:1px solid var(--shb);font-size:13px}
  .selbar button.add{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border:1px solid var(--bd);background:var(--card);border-radius:3px;font:inherit;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;white-space:nowrap}
  .selbar button.add:hover{border-color:var(--green)} .selbar button.sdel{color:var(--nod)} .selbar button.sdone{background:var(--green);border-color:var(--green);color:#fff}
  .selbar .sall{cursor:pointer;color:var(--muted)} .selbar #selN{margin-left:6px}
  #selBtn.on{background:rgba(255,255,255,.28)}
  .prange{display:inline-flex;align-items:center;gap:6px;color:#fff;font-size:13px}
  .prange input{height:34px;border:0;border-radius:3px;padding:0 6px;font:inherit;color:#222;background:#fff}
  .psel{max-width:260px}
  td.del{width:40px;text-align:center}
  .x{border:0;background:transparent;color:#9a9a9a;width:32px;height:32px;display:inline-grid;place-items:center;border-radius:2px}
  .x:hover{color:var(--nod);background:var(--redbg2)}
  .c-sn{width:72px}.c-name{min-width:220px}.c-date{width:170px}
  .empty{padding:28px 12px;color:var(--muted);text-align:center}
  .foot{border-top:1px solid var(--grid);background:var(--head);display:flex;align-items:center;gap:14px;padding:6px 12px;font-size:13px;flex-wrap:wrap}
  .foot .add{background:var(--card);border:1px solid var(--bd);padding:5px 10px;border-radius:2px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .foot .add:hover{border-color:var(--green);color:var(--green)}
  .foot b{font-weight:600}
  a.tb{text-decoration:none}
  .bar .ttl{font-size:16px;font-weight:600;margin:0 4px}
  .home{flex:1;display:flex;align-items:center;align-content:safe center;justify-content:center;gap:20px;padding:24px;flex-wrap:wrap;overflow:auto;background:var(--soft)}
  .tile{width:260px;height:180px;background:var(--card);border:1px solid var(--grid);border-top:4px solid var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .tile:hover,.tile:focus-visible{border-color:var(--green);box-shadow:0 2px 12px rgba(33,115,70,.18);outline:none}
  .tile svg{color:var(--green)}
  .tile b{font-size:20px;font-weight:600}
  .tile span{color:var(--muted);font-size:13px;min-height:18px}
  table.docs{min-width:1130px}
  .c-wk{width:130px}
  td.wk input{text-align:center}
  table.pdocs{min-width:420px}
  table.ld{min-width:1150px}
  table.ld .c-date{width:142px}
  table.ld .c-amt{width:130px}
  .c-sp{min-width:200px}
  td.rem{font-weight:700}
  .negt{color:var(--nod)} .post{color:var(--okd)}
  table.wk{min-width:1150px} table.wk .c-date{width:142px} table.wk .c-amt{width:118px} table.wk .c-nm{min-width:200px} th.c-money svg{vertical-align:middle}
  td.wpro input{color:var(--okd);font-weight:600} td.wlos input{color:var(--nod);font-weight:600}
  table.prof{min-width:900px} table.prof .c-date{width:142px} table.prof .c-en{width:200px} table.prof .c-amt{width:140px}
  td.phow textarea{display:block;width:100%;border:0;outline:none;resize:none;background:transparent;font:inherit;line-height:1.5;padding:7px 8px;min-height:34px;overflow:hidden;color:var(--text)}
  td.phow textarea:focus{background:var(--card);box-shadow:inset 0 0 0 2px var(--green)}
  td.cprof{text-align:right;padding:0 8px;white-space:nowrap}
  table.cpa{min-width:1300px} table.cpa .c-from{min-width:180px}
  table.cpa .c-date{width:142px}
  table.cpa .c-id{width:160px;min-width:150px}
  table.cpa .c-amt{width:112px}
  table.cpa th.c,table.cpa td.tick{width:78px}
  .c-hmt{width:96px}
  td.hmt input{text-align:center}
  .c-id{width:190px;min-width:170px}
  td.idc input{font-variant-numeric:tabular-nums;letter-spacing:.02em}
  td.idc.bad{background:var(--redbg)!important;box-shadow:inset 0 0 0 2px var(--nod)}
  td.idc.dup:not(.bad){background:var(--orbg)!important;box-shadow:inset 3px 0 0 #e8a33d}
  .tempty{padding:12px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--grid)}
  /* expenses */
  .cards{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;padding:12px;background:var(--soft);border-bottom:1px solid var(--grid)}
  .cards .card{background:var(--card);border:1px solid var(--grid);border-top:3px solid var(--green);padding:8px 12px}
  .cards .card span{display:block;font-size:12px;color:var(--muted)}
  .cards .card b{font-size:18px;font-weight:700}
  .cards .card.neg{border-top-color:var(--nod)} .cards .card.neg b{color:var(--nod)}
  .cards .card.pos b{color:var(--okd)}
  .etabs{display:flex;gap:0;border-bottom:1px solid var(--grid);background:var(--card);position:sticky;left:0}
  .etabs button{border:0;background:transparent;padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
  .etabs button.on{color:var(--green-d);border-bottom-color:var(--green)}
  .etools{display:flex;gap:8px;padding:8px 10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--grid)}
  .search.light{border:1px solid var(--bd);flex:0 1 300px}
  .etools select{border:1px solid var(--bd);padding:7px 8px;border-radius:2px;background:var(--card)}
  table.etable{min-width:1000px}
  td select{width:100%;height:33px;border:0;background:transparent;padding:0 6px;outline:none}
  td select:focus{box-shadow:inset 0 0 0 2px var(--green);background:var(--card)}
  td.amt input{text-align:right}
  .c-amt{width:120px}.c-en{min-width:180px}.c-cat{width:150px}.c-mon{min-width:200px}
  td.calc{text-align:right;padding:0 8px;white-space:nowrap;color:var(--muted)}
  td.calc.pos,.wstats .pos{color:var(--okd);font-weight:700}
  td.calc.neg,.wstats .neg{color:var(--nod);font-weight:700}
  #months{padding:12px;display:grid;gap:12px;background:var(--soft);min-height:100%}
  .legend{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;margin-left:auto}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:1px} .lg-in{background:#5b8def} .lg-out{background:var(--green)} .lg-pw{background:#e08a1e} .lg-wd{background:#9b59b6}
  .vchart{display:flex;align-items:flex-end;gap:10px;height:170px;padding:6px 2px 0;border-bottom:1px solid var(--grid)}
  .vcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:28px}
  .vbars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
  .vbars i{display:block;width:40%;max-width:18px;min-height:1px;border-radius:2px 2px 0 0} .vbars i.in{background:#5b8def} .vbars i.out{background:var(--green)}
  .vcol span{font-size:11px;color:var(--muted);padding:4px 0}
  #weeks{padding:12px;display:grid;gap:12px;background:var(--soft);min-height:100%}
  .week{background:var(--card);border:1px solid var(--grid);padding:12px 14px}
  .week.now{border-color:var(--green)}
  .whead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .whead b{font-size:15px}
  .wtag{font-size:12px;background:var(--sh);color:var(--green-d);padding:2px 8px;border-radius:2px}
  .week.now .wtag{background:var(--green);color:#fff}
  .wstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
  .wstats span{display:block;font-size:12px;color:var(--muted)}
  .wstats b{font-size:16px}
  .wcats{display:grid;gap:4px;margin:6px 0}
  .wcat{display:grid;grid-template-columns:130px 1fr 100px;align-items:center;gap:8px;font-size:13px}
  .wcat i{display:block;height:10px;background:var(--green);border-radius:1px}
  .wcat b{text-align:right}
  .wtop{font-size:13px;color:var(--muted)} .wtop b{color:var(--text)}
  @media (max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.wstats{grid-template-columns:repeat(2,1fr)}.wcat{grid-template-columns:100px 1fr 80px}}
  .pnote{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-bottom:1px solid var(--grid);background:var(--card);color:#c9c9c9;cursor:text}
  .pnote svg{flex:none;margin-top:3px}
  .pnote textarea{flex:1;border:0;outline:none;resize:none;background:transparent;font:inherit;line-height:1.5;padding:2px 0;min-height:24px;overflow:hidden;color:var(--text)}
  .pnote textarea::placeholder{color:#a8a8a8}
  .pnote:focus-within{box-shadow:inset 0 0 0 2px var(--green)}
  .pnote.filled{background:var(--redbg);color:var(--nod);box-shadow:inset 4px 0 0 var(--nod)}
  .pnote.filled:focus-within{box-shadow:inset 4px 0 0 var(--nod),inset 0 0 0 2px var(--nod)}
  .pnote.filled textarea{color:var(--nod);font-weight:700;font-size:15px}
  .stage[hidden]{display:none}
  tr.newrow td{background:var(--soft2)}
  tr.newrow td.num{color:#b0b0b0}
  tr.newrow td.num svg{margin:auto}
  tr.newrow input::placeholder{color:#a8a8a8}
  td.tk.filled{background:var(--redbg)!important;box-shadow:inset 3px 0 0 var(--nod)}
  td.tk.filled input{color:var(--nod);font-weight:700}
  .stage{margin:0 0 18px}
  /* CPA and Leiden stages: pink and purple in turn */

  #days .stage:nth-child(even) .shead,#ldst .stage:nth-child(even) .shead{background:#ede4fb;border-color:#cdb8f0;box-shadow:inset 5px 0 0 #8a5cd6}
  #days .stage:nth-child(odd) .sname,#ldst .stage:nth-child(odd) .sname{color:#b0306c}
  #days .stage:nth-child(even) .sname,#ldst .stage:nth-child(even) .sname{color:#6a3cb5}
  html.dark #days .stage:nth-child(odd) .shead,html.dark #ldst .stage:nth-child(odd) .shead{background:#3b2230;border-color:#5a3449}
  html.dark #days .stage:nth-child(even) .shead,html.dark #ldst .stage:nth-child(even) .shead{background:#2d2440;border-color:#46385f}
  html.dark #days .stage:nth-child(odd) .sname,html.dark #ldst .stage:nth-child(odd) .sname{color:#f08bbb}
  html.dark #days .stage:nth-child(even) .sname,html.dark #ldst .stage:nth-child(even) .sname{color:#b89af0}
  .snote{position:sticky;left:0;padding:4px 10px;font-size:13px;color:#e8a0a0;border-bottom:1px solid var(--grid)}

  .sname:focus{border-color:var(--green);box-shadow:0 0 0 1px var(--green);background:var(--card)}
  .scount{font-size:13px;color:var(--muted);white-space:nowrap}
  .shead .add{background:var(--card);border:1px solid var(--bd);padding:5px 10px;border-radius:2px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .shead .add:hover{border-color:var(--green);color:var(--green)}
  .stage th{top:0}
  .c-dn{min-width:200px}.c-tx{min-width:170px}
  td.num{text-align:center;font-weight:600;width:72px}
  .gsearch{flex:1 1 320px;max-width:560px}

  .gitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--grid);border-left:3px solid transparent;padding:8px 12px;margin:0 0 4px;border-radius:2px}

  .gitem span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .phead{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--grid)}

  .phead .add{background:var(--card);border:1px solid var(--bd);padding:5px 10px;border-radius:2px;font-weight:600;display:inline-flex;align-items:center;gap:5px}

  if (/email-already-in-use/i.test(c)) return 'That username is taken';
  if (/weak-password/i.test(c)) return 'Password must be at least 6 characters';

// ---------- login / first-time setup ----------
let unsub = null, creating = false, signedIn = false;
// pages: home (two buttons), #needs (What I need), #records (See records)
function stop() { if (unsub) { unsub(); unsub = null; } }
function route() {
  if (!signedIn) return;
  stop();
  SEL.on = false; SEL.ids.clear(); SEL.cfg = null; // selecting ends when the page changes
  const h = location.hash;
  if (h === '#records') showSheet(); else if (h === '#needs') showDocs(); else if (h === '#where') showWhere(); else if (h === '#expenses') showExpenses(); else if (h === '#cpa') showCpa(); else if (h === '#leiden') showLdChoice(); else if (h === '#leihen') showLeiden('ld'); else if (h === '#ausleihen') showLeiden('al'); else if (h === '#work') showWork(); else if (h === '#profit') showProfit(); else if (h === '#archive') showArchive(); else showHome();
}
window.addEventListener('hashchange', route);
auth.onAuthStateChanged(async user => {
  if (creating) return; // first account is being set up
  stop();
  signedIn = false;
  if (!user) return showLogin();
  try {
    const ok = (await db.ref('rec/members/' + user.uid).once('value')).val() === true;
    if (!ok) { await auth.signOut(); return showLogin('This account has no access'); }
    signedIn = true; route();
  } catch (e) { await auth.signOut(); showLogin(friendly(e)); }
});

async function showLogin(msg) {
  let setupDone = true;
  try { setupDone = (await db.ref('rec/setup').once('value')).val() === true; } catch {}
  $('#root').innerHTML = `
    <div class="login"><form id="lf" autocomplete="on">
      <h1>${setupDone ? 'Sign in' : 'Create account'}</h1>
      <label for="u">Username</label><input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="${setupDone ? 'current-password' : 'new-password'}" required minlength="6">
      ${setupDone ? '' : '<label for="p2">Password again</label><input id="p2" type="password" autocomplete="new-password" required minlength="6">'}
      <div class="err" id="lerr">${esc(msg || '')}</div>
      <button class="btn">${setupDone ? 'Sign in' : 'Create account'}</button>
    </form></div>`;
  $('#u').focus();
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const u = $('#u').value.trim().toLowerCase(), pw = $('#p').value, err = $('#lerr'), b = $('#lf button');
    if (!/^[a-z0-9_]{3,20}$/.test(u)) return err.textContent = 'Username: 3 to 20 letters, numbers or _';
    if (!setupDone && pw !== $('#p2').value) return err.textContent = 'Passwords do not match';
    b.disabled = true; err.textContent = '';
    try {
      if (setupDone) await auth.signInWithEmailAndPassword(emailOf(u), pw);
      else {
        creating = true;
        try {
          const { user } = await auth.createUserWithEmailAndPassword(emailOf(u), pw);
          try { await db.ref('rec').update({ setup: true, ['members/' + user.uid]: true }); }
          catch (x) { creating = false; await auth.signOut(); throw x; }
        } finally { creating = false; }
        signedIn = true; route();
      }
    } catch (x) { err.textContent = friendly(x); b.disabled = false; }
  };
}

// ---------- the sheet ----------
const rows = new Map(); // id -> data
const FIELDS = ['sn', 'name', 'forDate', 'sent', 'reply'];
let q = '';
function showHome() {
  $('#root').innerHTML = `

        <a class="tile" href="#expenses" id="goExp">${svg.wallet}<b>Expenses</b><span id="nExp"></span></a>
        <a class="tile" href="#cpa" id="goCpa">${svg.idcard}<b>CPA</b><span id="nCpa"></span></a>

    </div>`;
  $('#out').onclick = () => auth.signOut();
  drawThemeBtn(); $('#theme').onclick = toggleTheme;
  // one copy of everything: tile counts + search
  const H = {};
  const nodes = ['rows', 'topics', 'docs', 'stages', 'places', 'income', 'expenses', 'cpa', 'cpaDays', 'ld', 'ldStages', 'al', 'alStages', 'work', 'profit', 'archive'];
  const set = (id, t) => { const e = $(id); if (e) e.textContent = t; };
  const counts = () => {
    const v = k => Object.values(H[k] || {}), n = (k, one, many) => { const c = v(k).length; return c === 1 ? '1 ' + one : c + ' ' + many; };

    set('#nCpa', n('cpa', 'entry', 'entries'));
    const remOf = k => rs(v(k).reduce((t, r) => t + (Number(r.amt) || 0) - (Number(r.gave) || 0), 0));
    set('#nLd', `Leihen ${remOf('ld')} · Ausleihen ${remOf('al')}`);
    set('#nWork', n('work', 'entry', 'entries'));
    set('#nProfit', `Total ${rs(v('profit').reduce((t, r) => t + (Number(r.amt) || 0), 0))}`);
    archive.clear(); Object.entries(H.archive || {}).forEach(([k, a]) => archive.set(k, a));
    set('#nArch', archive.size ? String(archive.size) : '');
  };
  const refs = nodes.map(k => { const r = db.ref('rec/' + k); const h = s => { H[k] = s.val() || {}; counts(); if (k === 'archive') purgeArchive(); if ($('#gq') && $('#gq').value.trim()) drawResults(); }; r.on('value', h, () => {}); return [r, h]; });
  unsub = () => refs.forEach(([r, h]) => r.off('value', h));

  let sel = 0, results = [];
  const gq = $('#gq');
  function drawResults() {
    const q = gq.value.trim().toLowerCase(), box = $('#gres');
    results = q ? searchAll(H, q) : [];
    $('#tiles').hidden = !!q;
    box.hidden = !q;
    if (!q) return;
    if (sel >= results.length) sel = 0;
    let last = '';
    box.innerHTML = results.length ? results.slice(0, 60).map((r, k) => {
      const head = r.section !== last ? `<div class="ghead">${esc(r.section)}</div>` : ''; last = r.section;
      return `${head}<button type="button" class="gitem ${k === sel ? 'on' : ''}" data-k="${k}"><b>${hilite(r.title, q)}</b><span>${hilite(r.sub, q)}</span></button>`;
    }).join('') + (results.length > 60 ? `<div class="gmore">${results.length - 60} more. Type more to narrow it down.</div>` : '')

  }
  gq.oninput = () => { sel = 0; drawResults(); };
  gq.onkeydown = e => {

    else if (e.key === 'Enter') { e.preventDefault(); goToResult(results[sel]); }
  };
  $('#gres').onclick = e => { const b = e.target.closest('.gitem'); if (b) goToResult(results[+b.dataset.k]); };
  gq.focus();
}
const hilite = (t, q) => { const s = String(t || ''), i = s.toLowerCase().indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)); };
// every section, every useful field

  for (const [id, s] of E('stages')) if (has(s.name)) out.push({ section: 'What I need', title: s.name, sub: 'Stage', hash: '#needs', sel: `#stages .stage[data-sid="${id}"]` });
  for (const [id, d] of E('docs')) if (has(d.name, d.how, d.task, d.who)) out.push({ section: 'What I need', title: d.name || '(no name)', sub: [nm('stages', d.stage), d.task && 'Task: ' + d.task, d.how, d.who].filter(Boolean).join(' · '), hash: '#needs', sel: `#stages tr[data-id="${id}"]` });
  for (const [pid, p] of E('places')) {
    if (has(p.name, p.note)) out.push({ section: 'Where to what', title: p.name || '(no name)', sub: p.note ? 'Instruction: ' + p.note : 'Name', hash: '#where', sel: `#places .stage[data-pid="${pid}"]` });

  }
  for (const [id, x] of E('expenses')) if (has(x.name, x.where, catName(x.cat))) out.push({ section: 'Expenses', title: x.name || '(no name)', sub: `${rs(x.cost)} · ${x.date || ''}${x.where ? ' · ' + x.where : ''}`, hash: '#expenses', tab: 'spent', sel: `#erows tr[data-id="${id}"]` });

// ---------- Archive: deleted things wait here 30 days, then go for good ----------
const ARCH_DAYS = 30, archive = new Map();
const pickData = o => JSON.parse(JSON.stringify(o)); // plain copy of what is shown
// items: { 'docs/<id>': data, ... } (paths inside rec/). extra: other changes saved together.
// ifExists: { 'expenses/<id>/money': value } put back on restore only if that line still exists.
function toArchive(section, label, items, extra = {}, ifExists = {}) {
  const aid = db.ref('rec/archive').push().key;
  const up = { ...extra };
  for (const k of Object.keys(items)) {
    up[k] = null;
    gone.add(k.split('/').pop()); // late saves for this item are skipped
    cancelSaves('rec/' + k + '/');
  }
  up['archive/' + aid] = { section, label: String(label || '').slice(0, 200), data: JSON.stringify({ items, ifExists }), deletedAt: TS() };
  db.ref('rec').update(up)
    .then(() => toastAction('Moved to Archive', 'Undo', () => restoreArchive(aid)))
    .catch(x => toast(friendly(x)));
  return aid;
}
async function restoreArchive(aid) {
  let a = archive.get(aid);
  if (!a) a = (await db.ref('rec/archive/' + aid).once('value')).val();
  if (!a) return;
  let d; try { d = JSON.parse(a.data); } catch { return toast('This item cannot be restored'); }
  const up = { ['archive/' + aid]: null };
  const fresh = v => (v && typeof v === 'object' && 'updatedAt' in v) ? { ...v, updatedAt: TS() } : v;
  for (const [k, v] of Object.entries(d.items || {})) { up[k] = fresh(v); gone.delete(k.split('/').pop()); }
  for (const [k, v] of Object.entries(d.ifExists || {})) {
    const line = k.split('/').slice(0, 2).join('/');
    if ((await db.ref('rec/' + line).once('value')).exists()) up[k] = v;
  }
  try { await db.ref('rec').update(up); toast('Restored'); }
  catch { toast('Could not restore. Its stage, topic or name is in the Archive too: restore that first.'); }
}
function purgeArchive() {
  const old = Date.now() - ARCH_DAYS * 86400000, up = {};

  if (Object.keys(up).length) db.ref('rec/archive').update(up).catch(() => {});
}

      toArchive('Expenses', `Money received: ${it.from || '?'} ${rs(it.amount)}`, { ['income/' + id]: pickData(it) }, extra, back);
    } else {
      const it = expenses.get(id); if (!it) return;
      toArchive('Expenses', `Expense: ${it.name || '(no name)'} ${rs(it.cost)}`, { ['expenses/' + id]: pickData(it) });
    }
  });
  body.addEventListener('keydown', e => {
    const i = e.target.closest('input[data-x]'); if (!i || e.key !== 'Enter') return;
    e.preventDefault();
    let next = i.closest('tr').nextElementSibling;
    while (next && next.hidden) next = next.nextElementSibling;
    const n = next && next.querySelector(`[data-x="${i.dataset.x}"]`);
    if (n) n.focus(); else i.blur();
  });
  let got = 0;
  const refs = [[db.ref('rec/income'), income], [db.ref('rec/expenses'), expenses], [db.ref('rec/expWeeks'), weeksSaved]];
  const handlers = refs.map(([ref, m]) => {
    const h = snap => { m.clear(); snap.forEach(c => { m.set(c.key, c.val()); }); got |= 1 << refs.findIndex(r => r[1] === m); if (got === 7) { saveWeeks(); drawCards(); drawExpBody(); } };
    ref.on('value', h, e => toast(friendly(e)));
    return h;
  });
  unsub = () => { refs.forEach(([ref], k) => ref.off('value', handlers[k])); income.clear(); expenses.clear(); weeksSaved.clear(); };
}

// typing in the empty row: create the line, then move the cursor into it

// ---------- weekly summaries ----------
function weekData() {
  const weeks = new Map();
  const W = ws => { if (!weeks.has(ws)) weeks.set(ws, { received: 0, spent: 0, count: 0, cats: {}, items: [] }); return weeks.get(ws); };
  for (const it of income.values()) if (it.date) W(weekStart(it.date)).received += Number(it.amount) || 0;
  for (const ex of expenses.values()) if (ex.date) {
    const w = W(weekStart(ex.date)), c = Number(ex.cost) || 0;
    w.spent += c; w.count++; w.items.push(ex);
    const k = ex.cat || 'none'; w.cats[k] = (w.cats[k] || 0) + c;
  }
  return weeks;
}
function saveWeeks() {
  // every finished week gets its summary saved (and re-saved if its entries were changed later)
  const cur = weekStart(today()), up = {}, data = weekData();
  for (const [ws, w] of data) {
    if (ws >= cur) continue;
    const row = { received: w.received, spent: w.spent, count: w.count, cats: w.cats };
    const old = weeksSaved.get(ws);
    const same = old && old.received === row.received && old.spent === row.spent && old.count === row.count && JSON.stringify(old.cats || {}) === JSON.stringify(row.cats);
    if (!same) up[ws] = { ...row, savedAt: TS() };
  }
  for (const ws of weeksSaved.keys()) if (!data.has(ws)) up[ws] = null; // week no longer has entries
  if (Object.keys(up).length) db.ref('rec/expWeeks').update(up).catch(() => {});
}
function drawWeeks() {
  const el = $('#weeks'); if (!el) return;
  const data = weekData(), cur = weekStart(today());
  const keys = [...new Set([...data.keys(), ...weeksSaved.keys()])].sort().reverse();
  if (!keys.length) { el.innerHTML = '<div class="empty">No entries yet</div>'; drawExpTotals(); return; }
  // money left at the end of each week
  let run = 0; const leftAt = {};
  [...keys].reverse().forEach(ws => { const w = data.get(ws) || weeksSaved.get(ws) || {}; run += (w.received || 0) - (w.spent || 0); leftAt[ws] = run; });
  el.innerHTML = keys.map(ws => {
    const w = data.get(ws) || { ...weeksSaved.get(ws), items: [] };
    const saved = weeksSaved.has(ws), now = ws === cur;
    const cats = Object.entries(w.cats || {}).sort((a, b) => b[1] - a[1]);
    const max = Math.max(1, ...cats.map(c => c[1]));
    const top = [...(w.items || [])].sort((a, b) => (Number(b.cost) || 0) - (Number(a.cost) || 0)).slice(0, 3);
    return `
      <section class="week ${now ? 'now' : ''}" data-week="${ws}">
        <div class="whead"><b>${niceDate(ws)} – ${niceDateY(addDays(ws, 6))}</b>
          <span class="wtag">${now ? 'This week, so far' : saved ? 'Saved' : ''}</span></div>
        <div class="wstats">
          <div><span>Received</span><b>${rs(w.received)}</b></div>
          <div><span>Spent</span><b>${rs(w.spent)}</b></div>
          <div><span>${now ? 'Left now' : 'Left at end of week'}</span><b class="${leftAt[ws] < 0 ? 'neg' : 'pos'}">${rs(leftAt[ws])}</b></div>
          <div><span>Expenses</span><b>${w.count || 0}</b></div>
        </div>
        ${cats.length ? `<div class="wcats">${cats.map(([k, v]) => `<div class="wcat"><span>${esc(catName(k) || 'No category')}</span><i style="width:${Math.max(4, Math.round(v / max * 100))}%"></i><b>${rs(v)}</b></div>`).join('')}</div>` : ''}
        ${top.length ? `<div class="wtop"><span>Biggest:</span> ${top.map(t => `${esc(t.name || 'Expense')} <b>${rs(t.cost)}</b>`).join(' · ')}</div>` : ''}
      </section>`;
  }).join('');
  drawExpTotals();
}

// ---------- monthly summary (with a chart) ----------
function drawMonths() {
  const el = $('#months'); if (!el) return;
  const M = new Map();
  const G = k => { if (!M.has(k)) M.set(k, { received: 0, spent: 0, count: 0, cats: {}, items: [] }); return M.get(k); };
  for (const it of income.values()) if (it.date) G(monthKeyOf(it.date)).received += Number(it.amount) || 0;
  for (const ex of expenses.values()) if (ex.date) { const m = G(monthKeyOf(ex.date)), c = Number(ex.cost) || 0; m.spent += c; m.count++; m.items.push(ex); const k = ex.cat || 'none'; m.cats[k] = (m.cats[k] || 0) + c; }

    </section>` + [...keys].reverse().map(k => {

          <div><span>Expenses</span><b>${m.count}</b></div>
        </div>
        ${cats.length ? `<div class="wcats">${cats.map(([c, v]) => `<div class="wcat"><span>${esc(catName(c) || 'No category')}</span><i style="width:${Math.max(4, Math.round(v / max * 100))}%"></i><b>${rs(v)}</b></div>`).join('')}</div>` : ''}
        ${top.length ? `<div class="wtop"><span>Biggest:</span> ${top.map(t => `${esc(t.name || 'Expense')} <b>${rs(t.cost)}</b>`).join(' · ')}</div>` : ''}
      </section>`;
  }).join('');
  el.querySelectorAll('.wtag:empty').forEach(t => t.remove());
  drawExpTotals();
}
function expDownload() {

  const lines = [['Type', 'Date', 'Name / From whom', 'Amount (Rs.)', 'Where / Note', 'Category', 'Money used']];
  incomeIds().filter(id => inPer(exDate(income.get(id)), eP)).forEach(id => { const x = income.get(id); lines.push(['Received', x.date || '', x.from || '', x.amount || 0, x.note || '', '', '']); });
  expIds().filter(id => inPer(exDate(expenses.get(id)), eP)).forEach(id => { const x = expenses.get(id); lines.push(['Spent', x.date || '', x.name || '', x.cost || 0, x.where || '', catName(x.cat), moneyLabel(x.money)]); });
  const csv = '﻿' + lines.map(l => l.map(x => cell(String(x))).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `expenses-${perFile(eP)}.csv`;

  box.innerHTML = keys.length ? `<div class="months">${keys.map(k => { const m = M.get(k); return `
    <section class="week"><div class="whead"><b>${k === 'none' ? 'No date' : monthName(k)}</b>${k === 'none' ? '' : `<span class="wtag">${monthSpan(k)}</span>`}</div>
      <div class="wstats"><div><span>${LM.got}</span><b>${rs(m.amt)}</b></div><div><span>${LM.gave}</span><b>${rs(m.gave)}</b></div><div><span>Difference</span><b class="${m.amt - m.gave ? 'neg' : 'pos'}">${rs(m.amt - m.gave)}</b></div><div><span>Entries / people</span><b>${m.n} / ${m.people.size}</b></div></div>
      <div class="wcats"><div class="wcat"><span>${LM.got}</span><i style="width:${Math.max(2, Math.round(m.amt / max * 100))}%"></i><b>${rs(m.amt)}</b></div><div class="wcat"><span>${LM.gave}</span><i class="gave" style="width:${Math.max(2, Math.round(m.gave / max * 100))}%"></i><b>${rs(m.gave)}</b></div></div>
    </section>`; }).join('')}</div>` : '<div class="empty">No entries yet</div>';
}
const monthName = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }); };
async function addLdStage() {
  const ref = db.ref('rec/' + LM.st).push();
  ref.set({ name: 'Stage ' + (ldStages.size + 1), createdAt: TS() }).catch(x => toast(friendly(x)));
  if (lq) { $('#lq').value = ''; lq = ''; ldFilter(); }
  const sec = await waitFor(`#ldst .stage[data-sid="${CSS.escape(ref.key)}"]`);
  if (sec) { sec.scrollIntoView({ block: 'nearest' }); const i = sec.querySelector('.lname'); i.focus(); i.select(); }
}
async function addLdRow(sid, field) {
  if (!ldStages.has(sid)) return;
  const max = Math.max(0, ...[...ldRows.keys()].filter(id => ldRows.get(id).stage === sid).map(ldSn).filter(isFinite));
  const ref = db.ref('rec/' + LM.node).push();
  if (!inPer(today(), lP)) Object.assign(lP, newPer()); // a new entry is dated today: show it
  ref.set({ stage: sid, sn: String(Math.floor(max) + 1), ...(LM.date ? { date: today() } : {}), from: '', amt: 0, gave: 0, spent: '', clr: '', createdAt: TS(), updatedAt: TS() }).catch(x => toast(friendly(x)));
  if (lq) { $('#lq').value = ''; lq = ''; ldFilter(); }
  const tr = await waitFor(`#ldst tr[data-id="${CSS.escape(ref.key)}"]`);
  if (tr) { sortLd(); tr.scrollIntoView({ block: 'nearest' }); tr.querySelector(`[data-l="${typeof field === 'string' ? field : 'from'}"]`).focus(); }
}
function ldDownload() {
  const cell = v => /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  const lines = [['Stage', 'S.N.', ...(LM.date ? ['Date'] : []), LM.who, 'How much', LM.back, 'How much remaining', 'Where did I spend', 'Cleared', 'Not cleared']];
  ldStageIds().forEach(sid => {
    const name = ldStages.get(sid).name || '';
    [...ldRows.keys()].filter(id => ldRows.get(id).stage === sid && inPer(ldDate(ldRows.get(id)), lP)).sort((a, b) => ldSn(a) - ldSn(b)).forEach(id => {
      const r = ldRows.get(id);
      lines.push([name, r.sn || '', ...(LM.date ? [r.date || ''] : []), r.from || '', r.amt || 0, r.gave || 0, remainOf(r), r.spent || '', r.clr === 'cleared' ? 'Yes' : '', r.clr === 'notcleared' ? 'Yes' : '']);
    });
  });
  const csv = '﻿' + lines.map(l => l.map(x => cell(String(x))).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `${LM.file}-${perFile(lP)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- See records (grouped in topics) ----------
const recTopics = new Map();
let rf = 'all'; // records filter
let fixingTopics = false;
const SHEET_HEAD = `<thead><tr>
  <th class="c-sn c">S.N.</th><th class="c-name">Name</th><th class="c-date">For when</th><th class="c-date">Sent date</th><th class="c-date">Reply received date</th>
  <th class="c">Approved</th><th class="c">Rejected</th><th aria-label="Delete"></th></tr></thead>`;
function showSheet() {
  $('#root').innerHTML = `
    <div class="app">
      <div class="bar">
        ${homeBtn()}
        <label class="search">${svg.search}<input id="q" type="search" placeholder="Search name or S.N." aria-label="Search"></label>
        <select id="rf" class="fsel" aria-label="Show"><option value="all">All</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="waiting">Waiting</option></select>
        <span class="net" id="net" hidden>Offline</span>
        <span class="sp"></span>
        <button class="tb" id="addTopic">${svg.plus}<span>Add topic</span></button>
        <button class="tb" id="csv">${svg.down}<span>Download Excel</span></button>
      </div>
      <div class="wrap" id="wrap">
        <div id="topics"></div>
        <div class="empty" id="empty" hidden></div>
      </div>
      <div class="foot">
        <button class="add" id="addTopic2">${svg.plus}Add topic</button>
        <span id="sum"></span>
      </div>
    </div>`;
  q = ''; rf = 'all';
  $('#q').oninput = () => { q = $('#q').value.trim().toLowerCase(); filter(); };
  $('#rf').onchange = () => { rf = $('#rf').value; filter(); };
  $('#addTopic').onclick = $('#addTopic2').onclick = addTopic;
  $('#csv').onclick = download;
  const box = $('#topics');
  box.addEventListener('input', onInput);
  box.addEventListener('change', onInput);
  box.addEventListener('click', onClick);
  box.addEventListener('keydown', onKey);
  box.addEventListener('focusout', e => { const i = e.target.closest('[data-f]'); if (i && i.type !== 'date') onInput({ type: 'change', target: i }); setTimeout(() => { if (!box.contains(document.activeElement)) sortRows(); }, 0); });

  let gotR = false, gotT = false;
  const ref = db.ref('rec/rows'), tref = db.ref('rec/topics');
  const onVal = snap => { rows.clear(); snap.forEach(c => { rows.set(c.key, c.val()); }); gotR = true; if (gotT) drawSheet(); };
  const onTop = snap => { recTopics.clear(); snap.forEach(c => { recTopics.set(c.key, c.val()); }); gotT = true; if (gotR) drawSheet(); };
  ref.on('value', onVal, e => toast(friendly(e)));
  tref.on('value', onTop, e => toast(friendly(e)));
  const con = db.ref('.info/connected');
  const onCon = s => { const n = $('#net'); if (n) n.hidden = s.val() !== false; };
  con.on('value', onCon);
  unsub = () => { ref.off('value', onVal); tref.off('value', onTop); con.off('value', onCon); rows.clear(); recTopics.clear(); };
}

const topicIds = () => [...recTopics.keys()].sort(byTime(recTopics));
const topicOf = r => recTopics.has(r.topic) ? r.topic : topicIds()[0];
function fixTopics() {
  // records from before topics (or whose topic was removed) go into the first topic; first time: make "Topic 1"
  if (!$('#topics')) { fixingTopics = false; return; }
  const orphans = [...rows.entries()].filter(([id, r]) => !recTopics.has(r.topic) && !gone.has(id)).map(([id]) => id);
  if (recTopics.size && !orphans.length) { fixingTopics = false; return; }
  const tid = recTopics.size ? topicIds()[0] : db.ref('rec/topics').push().key;
  const up = recTopics.size ? {} : { ['topics/' + tid]: { name: 'Topic 1', createdAt: TS() } };
  orphans.forEach(id => { up[`rows/${id}/topic`] = tid; up[`rows/${id}/updatedAt`] = TS(); });
  db.ref('rec').update(up).catch(() => {}).finally(() => { fixingTopics = false; });
}
function drawSheet() {
  const box = $('#topics'); if (!box) return;
  if (!recTopics.size) { if (!fixingTopics) { fixingTopics = true; setTimeout(fixTopics, 0); } return; }
  if (!fixingTopics && [...rows.entries()].some(([id, r]) => !recTopics.has(r.topic) && !gone.has(id))) { fixingTopics = true; setTimeout(fixTopics, 900); }
  const tids = topicIds();
  [...box.children].forEach(sec => { if (!recTopics.has(sec.dataset.tid)) sec.remove(); });
  tids.forEach((tid, n) => {
    let sec = box.querySelector(`.stage[data-tid="${CSS.escape(tid)}"]`);
    if (!sec) {
      sec = document.createElement('section'); sec.className = 'stage'; sec.dataset.tid = tid;
      sec.innerHTML = `
        <div class="shead">
          <input class="sname tname" maxlength="80" aria-label="Topic name" placeholder="Topic name">
          <span class="scount"></span>
          <span class="sp"></span>
          <button type="button" class="add radd">${svg.plus}New row</button>
          <button type="button" class="x tdel" aria-label="Delete topic">${svg.trash}</button>
        </div>
        <table class="sheet">${SHEET_HEAD}<tbody></tbody></table>
        <div class="tempty">No records in this topic yet</div>`;
    }
    if (box.children[n] !== sec) box.insertBefore(sec, box.children[n] || null);
    const tn = sec.querySelector('.tname'), name = recTopics.get(tid).name || '';
    if (tn !== document.activeElement && tn.value !== name) tn.value = name;
  });
  // rows into their topic
  document.querySelectorAll('#topics tr[data-id]').forEach(tr => { if (!rows.has(tr.dataset.id)) tr.remove(); });
  for (const id of rows.keys()) drawRow(id);
  if (!box.contains(document.activeElement)) sortRows();
  filter();
}

const trOf = id => document.querySelector(`#topics tr[data-id="${CSS.escape(id)}"]`);
const tbodyOf = tid => document.querySelector(`#topics .stage[data-tid="${CSS.escape(tid)}"] tbody`);
function drawRow(id) {
  const r = rows.get(id); if (!r) return;
  const tb = tbodyOf(topicOf(r)); if (!tb) return;
  let tr = trOf(id);
  if (!tr) {
    tr = document.createElement('tr'); tr.dataset.id = id;
    tr.innerHTML = `
      <td><input type="text" data-f="sn" maxlength="12" inputmode="numeric" aria-label="S.N."></td>
      <td><input type="text" data-f="name" maxlength="120" aria-label="Name"></td>
      <td><input type="date" data-f="forDate" aria-label="For when"></td>
      <td><input type="date" data-f="sent" aria-label="Sent date"></td>
      <td><input type="date" data-f="reply" aria-label="Reply received date"></td>
      <td class="tick"><button type="button" class="chk ap" data-s="approved" aria-label="Approved">${svg.check}</button></td>
      <td class="tick"><button type="button" class="chk rj" data-s="rejected" aria-label="Rejected">${svg.check}</button></td>
      <td class="del"><button type="button" class="x" aria-label="Delete row">${svg.trash}</button></td>`;
  }
  if (tr.parentElement !== tb && !tr.contains(document.activeElement)) tb.appendChild(tr);
  for (const f of FIELDS) { const i = tr.querySelector(`[data-f="${f}"]`); if (i !== document.activeElement && i.value !== (r[f] || '')) i.value = r[f] || ''; }
  tr.className = r.status || '';
  tr.querySelectorAll('.chk').forEach(b => { const on = r.status === b.dataset.s; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
}

const snNum = r => { const n = parseFloat(r.sn); return isNaN(n) ? Infinity : n; };
const bySn = (a, b) => snNum(rows.get(a)) - snNum(rows.get(b)) || (rows.get(a).createdAt || 0) - (rows.get(b).createdAt || 0);
function sortRows() {
  for (const tid of recTopics.keys()) {
    const tb = tbodyOf(tid); if (!tb) continue;
    const ids = [...rows.keys()].filter(id => topicOf(rows.get(id)) === tid).sort(bySn);
    ids.forEach((id, i) => { const tr = trOf(id); if (tr && tb.children[i] !== tr) tb.insertBefore(tr, tb.children[i] || null); });
  }
}
function filter() {
  let shown = 0, ap = 0, rj = 0;
  const per = {};
  for (const [id, r] of rows) {
    const hit = (!q || String(r.name || '').toLowerCase().includes(q) || String(r.sn || '').toLowerCase() === q)
      && (rf === 'all' || (rf === 'waiting' ? !r.status : r.status === rf));
    const tr = trOf(id); if (tr) tr.hidden = !hit;
    const t = topicOf(r), c = per[t] || (per[t] = { n: 0, hit: 0, ap: 0, rj: 0 });
    c.n++; if (hit) { c.hit++; shown++; }
    if (r.status === 'approved') { ap++; c.ap++; } else if (r.status === 'rejected') { rj++; c.rj++; }
  }
  document.querySelectorAll('#topics .stage').forEach(sec => {
    const c = per[sec.dataset.tid] || { n: 0, hit: 0, ap: 0, rj: 0 };
    sec.querySelector('.scount').textContent = `${c.n} ${c.n === 1 ? 'record' : 'records'}${c.n ? ` · Approved ${c.ap} · Rejected ${c.rj}` : ''}`;
    sec.querySelector('.tempty').hidden = c.n > 0;
    sec.hidden = (!!q || rf !== 'all') && !c.hit && !sec.contains(document.activeElement);
  });
  const total = rows.size, e = $('#empty');
  e.hidden = (!q && rf === 'all') || shown > 0;
  e.textContent = q ? `No name matches "${$('#q').value.trim()}"` : 'Nothing to show for this filter';
  $('#sum').innerHTML = `${q || rf !== 'all' ? `<b>${shown}</b> of ${total} shown · ` : ''}<b>${recTopics.size}</b> ${recTopics.size === 1 ? 'topic' : 'topics'} · <b>${total}</b> total · Approved <b>${ap}</b> · Rejected <b>${rj}</b> · Waiting <b>${total - ap - rj}</b>`;
}

// save typing (short delay so every key isn't a save)
const timers = {};
function onInput(e) {
  const tn = e.target.closest('.tname');
  if (tn) { const tid = tn.closest('.stage').dataset.tid, t = recTopics.get(tid); if (t) t.name = tn.value; saveAt(`rec/topics/${tid}/name`, cleanTxt(tn.value), e.type === 'change'); return; }
  const i = e.target.closest('[data-f]'); if (!i) return;
  const id = i.closest('tr').dataset.id, f = i.dataset.f, key = id + f;
  const v = f === 'name' || f === 'sn' ? i.value.replace(/\s+/g, ' ').trimStart() : i.value;
  const r = rows.get(id); if (r) r[f] = v;
  clearTimeout(timers[key]);
  const save = () => { if (gone.has(id)) return; db.ref('rec/rows/' + id).update({ [f]: f === 'name' || f === 'sn' ? v.trim() : v, updatedAt: TS() }).catch(x => { if (!gone.has(id)) toast(friendly(x)); }); };
  if (e.type === 'change') save(); else timers[key] = setTimeout(save, 500);
  if (f === 'name' || f === 'sn') filter();
}
function onClick(e) {
  const ra = e.target.closest('.radd');
  if (ra) return addRow(ra.closest('.stage').dataset.tid);
  const td = e.target.closest('.tdel');
  if (td) {
    const tid = td.closest('.stage').dataset.tid, t = recTopics.get(tid); if (!t) return;
    const inIt = [...rows.entries()].filter(([, r]) => topicOf(r) === tid).map(([id]) => id);
    if (!confirm(`Move "${t.name || 'this topic'}"${inIt.length ? ` and its ${inIt.length} ${inIt.length === 1 ? 'record' : 'records'}` : ''} to the Archive?`)) return;
    const items = { ['topics/' + tid]: pickData(t) };
    inIt.forEach(id => { items['rows/' + id] = pickData(rows.get(id)); FIELDS.forEach(f => clearTimeout(timers[id + f])); });
    toArchive('Records', `Topic: ${t.name || '(no name)'}${inIt.length ? ` (${inIt.length} ${inIt.length === 1 ? 'record' : 'records'})` : ''}`, items);
    return;
  }
  const b = e.target.closest('tr .chk, tr .x'); if (!b) return;
  const tr = b.closest('tr'), id = tr.dataset.id, r = rows.get(id); if (!r) return;
  if (b.classList.contains('x')) {
    FIELDS.forEach(f => clearTimeout(timers[id + f]));
    toArchive('Records', `Record ${r.sn || ''} ${r.name || '(no name)'} (${(recTopics.get(topicOf(r)) || {}).name || ''})`.replace(/\s+/g, ' '), { ['rows/' + id]: pickData(r) });
    return;
  }
  const status = r.status === b.dataset.s ? '' : b.dataset.s; // tick again to clear
  r.status = status; drawRow(id); filter();
  db.ref('rec/rows/' + id).update({ status, updatedAt: TS() }).catch(x => toast(friendly(x)));
}
// Enter moves down like Excel; on the last row of a topic it makes a new row there
function onKey(e) {
  if (e.key !== 'Enter') return;
  if (e.target.closest('.tname')) { e.preventDefault(); e.target.blur(); return; }
  const i = e.target.closest('[data-f]'); if (!i) return;
  e.preventDefault();
  let tr = i.closest('tr').nextElementSibling;
  while (tr && tr.hidden) tr = tr.nextElementSibling;
  if (tr) tr.querySelector(`[data-f="${i.dataset.f}"]`).focus();
  else if (!q) addRow(i.closest('.stage').dataset.tid, i.dataset.f);
}

async function addRow(tid, focusField) {
  if (typeof tid !== 'string' || !recTopics.has(tid)) tid = topicIds()[topicIds().length - 1];
  if (!tid) return;
  const max = Math.max(0, ...[...rows.values()].filter(r => topicOf(r) === tid).map(snNum).filter(isFinite));
  const ref = db.ref('rec/rows').push();
  ref.set({ sn: String(Math.floor(max) + 1), name: '', forDate: '', sent: '', reply: '', status: '', topic: tid, createdAt: TS(), updatedAt: TS() }).catch(x => toast(friendly(x)));
  if (q) { $('#q').value = ''; q = ''; filter(); }
  let tr = trOf(ref.key);
  for (let i = 0; !tr && i < 40; i++) { await new Promise(r => setTimeout(r, 50)); tr = trOf(ref.key); }
  if (tr) { sortRows(); tr.scrollIntoView({ block: 'nearest' }); tr.querySelector(`[data-f="${typeof focusField === 'string' ? focusField : 'name'}"]`).focus(); }
}
async function addTopic() {
  const ref = db.ref('rec/topics').push();
  ref.set({ name: 'Topic ' + (recTopics.size + 1), createdAt: TS() }).catch(x => toast(friendly(x))); // cursor moves as soon as the row shows, not after the server answers
  if (q) { $('#q').value = ''; q = ''; filter(); }
  const sec = await waitFor(`#topics .stage[data-tid="${CSS.escape(ref.key)}"]`);
  if (sec) { sec.scrollIntoView({ block: 'nearest' }); const i = sec.querySelector('.tname'); i.focus(); i.select(); }
}

function download() {
  const cell = v => /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  const order = topicIds();
  const list = [...rows.keys()].sort((a, b) => order.indexOf(topicOf(rows.get(a))) - order.indexOf(topicOf(rows.get(b))) || bySn(a, b)).map(id => rows.get(id));
  const lines = [['Topic', 'S.N.', 'Name', 'For when', 'Sent date', 'Reply received date', 'Approved', 'Rejected']]
    .concat(list.map(r => [(recTopics.get(topicOf(r)) || {}).name || '', r.sn || '', r.name || '', r.forDate || '', r.sent || '', r.reply || '', r.status === 'approved' ? 'Yes' : '', r.status === 'rejected' ? 'Yes' : '']));
  const csv = '﻿' + lines.map(l => l.map(x => cell(String(x))).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `records-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
</script>
</body>
</html>
